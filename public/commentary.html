<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMMENTARY MODE — AURALUX</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; padding: 40px 20px; }
    .back { display: inline-block; font-family: monospace; font-size: 0.65rem; letter-spacing: 0.2em; color: rgba(255,255,255,0.35); text-decoration: none; margin-bottom: 3rem; transition: color 0.2s; }
    .back:hover { color: white; }
    .container { max-width: 760px; margin: 0 auto; }
    .badge { font-family: monospace; font-size: 0.6rem; letter-spacing: 0.3em; color: rgba(255,255,255,0.3); margin-bottom: 1rem; }
    h1 { font-size: clamp(2rem, 6vw, 4rem); font-weight: 600; line-height: 1.1; margin-bottom: 0.5rem; }
    h1 .hollow { color: transparent; -webkit-text-stroke: 1.5px white; }
    .subtitle { font-size: 0.9rem; color: rgba(255,255,255,0.4); font-weight: 300; margin-bottom: 3rem; line-height: 1.6; }
    .input-label { font-family: monospace; font-size: 0.6rem; letter-spacing: 0.2em; color: rgba(255,255,255,0.3); margin-bottom: 8px; display: block; }
    textarea { width: 100%; height: 180px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 16px; color: white; font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; line-height: 1.6; resize: vertical; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: rgba(255,255,255,0.3); }
    textarea::placeholder { color: rgba(255,255,255,0.2); }
    .examples { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 24px; }
    .example-btn { background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 6px 14px; font-family: monospace; font-size: 0.6rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.2s; }
    .example-btn:hover { border-color: rgba(255,255,255,0.4); color: white; }
    .go-btn { width: 100%; padding: 16px; background: white; color: black; border: none; border-radius: 8px; font-family: monospace; font-size: 0.8rem; letter-spacing: 0.25em; cursor: pointer; transition: all 0.2s; font-weight: 600; margin-top: 4px; }
    .go-btn:hover { background: rgba(255,255,255,0.85); transform: translateY(-1px); }
    .go-btn:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; transform: none; }
    .output-wrap { margin-top: 40px; display: none; }
    .output-wrap.visible { display: block; }
    .output-label { font-family: monospace; font-size: 0.6rem; letter-spacing: 0.2em; color: rgba(255,255,255,0.3); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .copy-btn { background: transparent; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; padding: 4px 10px; font-family: monospace; font-size: 0.55rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.2s; }
    .copy-btn:hover { border-color: white; color: white; }
    .output-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 24px; font-size: 1rem; line-height: 1.8; color: rgba(255,255,255,0.9); white-space: pre-wrap; min-height: 120px; }
    .loading { display: flex; gap: 6px; align-items: center; padding: 24px; }
    .dot { width: 6px; height: 6px; background: white; border-radius: 50%; animation: bounce 0.8s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%,100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 48px 0; }
    .share-line { font-family: monospace; font-size: 0.6rem; letter-spacing: 0.15em; color: rgba(255,255,255,0.2); text-align: center; }
  </style>
</head>
<body>
<div class="container">
  <a href="/" class="back">← AURALUX</a>
  <div class="badge">EXPERIMENTAL TOOL</div>
  <h1>COMMENTARY <span class="hollow">MODE</span></h1>
  <p class="subtitle">Paste any boring text — terms and conditions, lecture notes, a breakup text, your landlord's email — and watch it become live sports commentary.</p>
  <span class="input-label">YOUR BORING TEXT</span>
  <textarea id="input" placeholder="Paste anything here. The more mundane the better."></textarea>
  <div class="examples">
    <button class="example-btn" data-text="Please be advised that your invoice #4421 is now 30 days overdue. Failure to remit payment within 14 business days will result in a late fee of 1.5% per month being applied to the outstanding balance.">Try: Overdue Invoice</button>
    <button class="example-btn" data-text="You must be at least 18 years of age to use this service. By continuing, you agree to our terms of service, privacy policy, and cookie policy. We may share your data with third party partners.">Try: Terms & Conditions</button>
    <button class="example-btn" data-text="Please remember to take out the trash on Tuesday evenings. Also, the WiFi password has been changed to Sunshine2024. Dinner will be at 7pm. Don't forget to call grandma.">Try: Family Group Chat</button>
  </div>
  <button class="go-btn" id="go-btn">🎙️ COMMENTATE THIS</button>
  <div class="output-wrap" id="output-wrap">
    <div class="output-label">
      <span>LIVE COMMENTARY</span>
      <button class="copy-btn" id="copy-btn">COPY</button>
    </div>
    <div class="output-box" id="output-box"></div>
  </div>
  <hr class="divider">
  <div class="share-line">AURALUX · COMMENTARY MODE · POWERED BY AI</div>
</div>
<script>
  const input = document.getElementById('input')
  const goBtn = document.getElementById('go-btn')
  const outputWrap = document.getElementById('output-wrap')
  const outputBox = document.getElementById('output-box')
  const copyBtn = document.getElementById('copy-btn')

  document.querySelectorAll('.example-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.text
      input.focus()
    })
  })

  goBtn.addEventListener('click', async () => {
    const text = input.value.trim()
    if (!text) return
    goBtn.disabled = true
    goBtn.textContent = 'LOADING...'
    outputWrap.classList.add('visible')
    outputBox.innerHTML = '<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>'
    try {
      const res = await fetch('/api/commentary', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text })
      })
      const data = await res.json()
      if (data.error) throw new Error(data.error)
      outputBox.textContent = data.commentary
    } catch (err) {
      outputBox.textContent = 'Something went wrong. Try again.'
      console.error(err)
    } finally {
      goBtn.disabled = false
      goBtn.textContent = '🎙️ COMMENTATE THIS'
    }
  })

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(outputBox.textContent)
    copyBtn.textContent = 'COPIED!'
    setTimeout(() => copyBtn.textContent = 'COPY', 2000)
  })
</script>
</body>
</html>
